<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서비스 소개 - 쉬운 글 배움터</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        :root { 
            --primary: #4a90e2; 
            --secondary: #ffd93d; 
            --bg: #fdfbf7; 
            --text: #333; 
            --white: #fff; 
            --error: #e74c3c; 
            --success: #2ecc71; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Nanum Gothic", sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.8; }

        /* 헤더 스타일: 로고와 메뉴 높이 수직 정렬 */
        header { 
            background: var(--white); 
            padding: 0 5%; 
            height: 90px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        
        .header-left { display: flex; align-items: center; gap: 40px; height: 100%; }
        .logo { font-size: 26px; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; height: 100%; }

        /* 메뉴 글자 높이를 로고와 1:1로 맞춤 */
        .nav-menu { display: flex; list-style: none; gap: 25px; align-items: center; height: 100%; }
        .nav-menu li { display: flex; align-items: center; height: 100%; }
        .nav-menu a { 
            text-decoration: none; 
            color: #555; 
            font-weight: 700; 
            font-size: 17px; 
            transition: 0.2s;
            display: flex;
            align-items: center; /* 로고와 텍스트 중앙 정렬 */
            height: 100%;
        }
        .nav-menu a:hover { color: var(--primary); }
        
        .header-right { display: flex; gap: 15px; align-items: center; height: 100%; }

        /* 버튼 및 레이아웃 */
        .btn { cursor: pointer; border: none; border-radius: 50px; font-weight: 700; transition: 0.2s; display: inline-block; font-size: 16px; text-align: center; text-decoration: none; }
        .btn-primary { background: var(--primary); color: #fff; padding: 12px 25px; }
        .btn-primary:hover { background: #357abd; }
        .btn-sub { background: #eee; color: #666; padding: 8px 15px; font-size: 14px; }
        .btn-outline { background: none; padding: 10px 15px; color: var(--text); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .intro-card { background: var(--white); padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .intro-title { color: var(--primary); font-size: 32px; font-weight: 800; margin-bottom: 25px; text-align: center; }

        /* 모달 스타일 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-content { background: #fff; padding: 35px; border-radius: 30px; width: 95%; max-width: 450px; max-height: 85vh; overflow-y: auto; position: relative; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px; outline: none; font-size: 16px; }
        
        .find-links { margin-top: 15px; display: flex; justify-content: center; gap: 15px; font-size: 14px; }
        .find-links a { color: #888; text-decoration: none; cursor: pointer; }
        .find-links a:hover { color: var(--primary); }

        footer { text-align: center; padding: 40px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="./index.html" class="logo">✨ 쉬운 글 배움터</a>
        <ul class="nav-menu">
            <li><a href="./about.html">서비스 소개</a></li>
            <li><a href="javascript:void(0)" onclick="protectedRoute('./text.html')">쉬운 글 변환기</a></li>
            <li><a href="javascript:void(0)" onclick="protectedRoute('./behavior.html')">행동 사전</a></li>
            <li><a href="javascript:void(0)" onclick="protectedRoute('./read.html')">글 읽어주기</a></li>
        </ul>
    </div>
    <div class="header-right">
        <div id="guest-menu" style="display: none;">
            <button class="btn btn-outline" onclick="openModal('loginModal')">로그인</button>
            <button class="btn btn-primary" onclick="openModal('signupModal')">회원가입</button>
        </div>
        <div id="user-menu" style="display: none;">
            <span id="u-info" style="font-weight: 700; color: #333; font-size: 16px; margin-right: 10px;"></span>
            <button class="btn btn-sub" onclick="handleLogout()">로그아웃</button>
        </div>
    </div>
</header>

<div class="container">
    <h2 class="intro-title">🤝 서비스 소개</h2>
    <div class="intro-card">
        <p>발달장애인과 경계선 지능인을 위한 정보 이해 지원 학습 서비스입니다.</p>
    </div>
</div>

<footer>© 2026 쉬운 글 배움터</footer>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-bottom:20px; color:var(--primary);">로그인</h2>
        <form id="loginForm">
            <div class="form-group"><label>아이디</label><input type="text" id="loginId" required></div>
            <div class="form-group"><label>비밀번호</label><input type="password" id="loginPw" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding: 15px;">로그인하기</button>
        </form>
        <div class="find-links">
            <a onclick="closeModal('loginModal'); openModal('findIdModal')">아이디 찾기</a>
            <span style="color:#eee">|</span>
            <a onclick="closeModal('loginModal'); openModal('findPwModal')">비밀번호 찾기</a>
        </div>
        <button onclick="closeModal('loginModal')" style="margin-top:15px; border:none; background:none; color:#999; cursor:pointer; width:100%;">닫기</button>
    </div>
</div>

<div id="findIdModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-bottom:10px; color:var(--primary);">아이디 찾기</h2>
        <p style="font-size:13px; color:#666; margin-bottom:20px;">가입 시 입력한 이름과 이메일을 입력해주세요.</p>
        <form id="findIdForm">
            <div class="form-group"><label>이름</label><input type="text" id="findIdName" required></div>
            <div class="form-group"><label>이메일</label><input type="email" id="findIdEmail" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding: 15px;">아이디 찾기</button>
        </form>
        <button onclick="closeModal('findIdModal'); openModal('loginModal')" style="margin-top:15px; border:none; background:none; color:var(--primary); font-weight:700; cursor:pointer; width:100%;">로그인으로 돌아가기</button>
    </div>
</div>

<div id="findPwModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-bottom:10px; color:var(--primary);">비밀번호 찾기</h2>
        <p style="font-size:13px; color:#666; margin-bottom:20px;">정보가 일치하면 이메일로 임시 비밀번호를 발송합니다.</p>
        <form id="findPwForm">
            <div class="form-group"><label>아이디</label><input type="text" id="findPwUserId" required></div>
            <div class="form-group"><label>이름</label><input type="text" id="findPwName" required></div>
            <div class="form-group"><label>이메일</label><input type="email" id="findPwEmail" required></div>
            <button type="submit" id="findPwBtn" class="btn btn-primary" style="width:100%; padding: 15px;">임시 비밀번호 발송</button>
        </form>
        <button onclick="closeModal('findPwModal'); openModal('loginModal')" style="margin-top:15px; border:none; background:none; color:var(--primary); font-weight:700; cursor:pointer; width:100%;">로그인으로 돌아가기</button>
    </div>
</div>

<script>
    const openModal = (id) => document.getElementById(id).style.display = 'flex';
    const closeModal = (id) => document.getElementById(id).style.display = 'none';

    function updateUI(isLoggedIn, name = "") {
        document.getElementById('guest-menu').style.display = isLoggedIn ? 'none' : 'flex';
        document.getElementById('user-menu').style.display = isLoggedIn ? 'flex' : 'none';
        if(isLoggedIn) document.getElementById('u-info').innerHTML = `✨ <strong>${name}</strong>님`;
    }

    window.onload = async () => {
        try {
            const res = await fetch('/api/check-auth');
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('currentUser', data.name);
                updateUI(true, data.name);
            } else { updateUI(false); }
        } catch { updateUI(false); }
    };

    // [중요] 아이디 찾기 로직
    document.getElementById('findIdForm').onsubmit = async function(e) {
        e.preventDefault();
        const name = document.getElementById('findIdName').value;
        const email = document.getElementById('findIdEmail').value;
        
        try {
            const res = await fetch('/api/find-id', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            });
            const data = await res.json();
            if (res.ok) {
                // 요청하신 포맷으로 alert 출력
                alert(`요청하신 회원님의 아이디는 [ ${data.userId} ] 입니다.`);
                closeModal('findIdModal');
                openModal('loginModal');
            } else {
                alert(data.message || "일치하는 정보가 없습니다.");
            }
        } catch {
            alert("서버 오류가 발생했습니다.");
        }
    };

    // 비밀번호 찾기 로직
    document.getElementById('findPwForm').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('findPwBtn');
        btn.innerText = "발송 중..."; btn.disabled = true;

        try {
            const res = await fetch('/api/find-pw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: document.getElementById('findPwUserId').value,
                    name: document.getElementById('findPwName').value,
                    email: document.getElementById('findPwEmail').value
                })
            });
            if (res.ok) {
                alert("이메일로 임시 비밀번호를 보내드렸습니다.");
                closeModal('findPwModal');
                openModal('loginModal');
            } else { alert("정보가 일치하지 않습니다."); }
        } catch { alert("연결 실패"); }
        finally { btn.innerText = "임시 비밀번호 발송"; btn.disabled = false; }
    };

    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: document.getElementById('loginId').value, pw: document.getElementById('loginPw').value })
        });
        if (res.ok) location.reload(); else alert("로그인 실패");
    };

    async function handleLogout() {
        if (confirm("로그아웃 하시겠습니까?")) {
            await fetch('/api/logout', { method: 'POST' });
            localStorage.removeItem('currentUser');
            location.href = "index.html";
        }
    }

    function protectedRoute(url) {
        if (!localStorage.getItem('currentUser')) { alert("로그인 후 이용 가능합니다."); openModal('loginModal'); }
        else location.href = url;
    }

    window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; };
</script>
</body>
</html>
