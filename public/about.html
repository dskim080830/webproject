<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서비스 소개 - 쉬운 글 배움터</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        :root { 
            --primary: #4a90e2; 
            --bg: #fdfbf7; 
            --text: #333; 
            --white: #fff; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Nanum Gothic", sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.8; }

        /* 헤더 스타일 */
        header { 
            background: var(--white); 
            padding: 0 5%; 
            height: 90px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        
        .header-left { display: flex; align-items: center; gap: 40px; height: 100%; }
        .logo { font-size: 26px; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; height: 100%; }
        .nav-menu { display: flex; list-style: none; gap: 25px; align-items: center; height: 100%; }
        .nav-menu a { text-decoration: none; color: #555; font-weight: 700; font-size: 17px; transition: 0.2s; display: flex; align-items: center; height: 100%; }
        .nav-menu a:hover { color: var(--primary); }
        .header-right { display: flex; gap: 15px; align-items: center; height: 100%; }

        /* 버튼 및 레이아웃 */
        .btn { cursor: pointer; border: none; border-radius: 50px; font-weight: 700; transition: 0.2s; display: inline-block; font-size: 16px; text-align: center; text-decoration: none; }
        .btn-primary { background: var(--primary); color: #fff; padding: 12px 25px; }
        .btn-sub { background: #eee; color: #666; padding: 8px 15px; font-size: 14px; }
        .btn-outline { background: none; padding: 10px 15px; color: var(--text); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .intro-title { color: var(--primary); font-size: 32px; font-weight: 800; margin-bottom: 35px; text-align: center; }
        .intro-card { background: var(--white); padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; }

        /* 모달 스타일 (제공된 이미지 디자인 반영) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-content { background: #fff; padding: 45px 35px; border-radius: 40px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        
        .modal-h2 { font-size: 28px; font-weight: 700; margin-bottom: 30px; text-align: left; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 15px; color: #333; }
        .form-group input { width: 100%; padding: 15px; border: 1.5px solid #eee; border-radius: 15px; outline: none; font-size: 16px; background: #fafafa; }
        
        .btn-login { width: 100%; padding: 18px; background-color: #5191e3; color: white; border: none; border-radius: 20px; font-size: 18px; font-weight: 700; margin-top: 10px; margin-bottom: 20px; cursor: pointer; }
        
        /* 선택 모달 전용 스타일 */
        .choice-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .btn-choice { width: 100%; padding: 20px; border: 2px solid #eee; border-radius: 20px; background: #fff; font-size: 17px; font-weight: 700; color: #555; cursor: pointer; transition: 0.2s; }
        .btn-choice:hover { border-color: var(--primary); color: var(--primary); background: #f0f7ff; }

        .modal-footer-links { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; font-size: 14px; color: #666; }
        .modal-footer-links span { cursor: pointer; text-decoration: underline; }
        .btn-close-text { background: none; border: none; color: #aaa; font-size: 15px; cursor: pointer; }

        footer { text-align: center; padding: 40px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="./index.html" class="logo">✨ 쉬운 글 배움터</a>
        <ul class="nav-menu">
            <li><a href="./about.html">서비스 소개</a></li>
            <li><a href="javascript:void(0)" onclick="protectedRoute('./text.html')">쉬운 글 변환기</a></li>
            <li><a href="javascript:void(0)" onclick="protectedRoute('./behavior.html')">행동 사전</a></li>
            <li><a href="javascript:void(0)" onclick="protectedRoute('./read.html')">글 읽어주기</a></li>
        </ul>
    </div>
    <div class="header-right">
        <div id="guest-menu" style="display: none;">
            <button class="btn btn-outline" onclick="openModal('loginModal')">로그인</button>
            <button class="btn btn-primary" onclick="openModal('signupModal')">회원가입</button>
        </div>
        <div id="user-menu" style="display: none;">
            <span id="u-info" style="font-weight: 700; margin-right: 10px;"></span>
            <button class="btn btn-sub" onclick="handleLogout()">로그아웃</button>
        </div>
    </div>
</header>

<div class="container">
    <h2 class="intro-title">🤝 서비스 소개</h2>
    <div class="intro-card">
        <p class="intro-text">
            쉬운 글 배움터는 누구나 정보를 평등하게 누릴 수 있는 세상을 만듭니다.
        </p>
    </div>
</div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <h2 class="modal-h2">로그인</h2>
        <form id="loginForm">
            <div class="form-group"><label>아이디</label><input type="text" id="loginId" required></div>
            <div class="form-group"><label>비밀번호</label><input type="password" id="loginPw" required></div>
            <button type="submit" class="btn btn-login">로그인하기</button>
        </form>
        <div class="modal-footer-links">
            <span onclick="closeModal('loginModal'); openModal('choiceModal')">아이디 / 비밀번호를 잊으셨나요?</span>
        </div>
        <button class="btn-close-text" onclick="closeModal('loginModal')">닫기</button>
    </div>
</div>

<div id="choiceModal" class="modal">
    <div class="modal-content">
        <h2 class="modal-h2" style="text-align: center;">어떤 정보를 찾으세요?</h2>
        <div class="choice-container">
            <button class="btn-choice" onclick="closeModal('choiceModal'); openModal('findIdModal')">👤 아이디 찾기</button>
            <button class="btn-choice" onclick="closeModal('choiceModal'); openModal('findPwModal')">🔒 비밀번호 찾기</button>
        </div>
        <button class="btn-close-text" style="margin-top: 30px;" onclick="closeModal('choiceModal'); openModal('loginModal')">취소</button>
    </div>
</div>

<div id="findIdModal" class="modal">
    <div class="modal-content">
        <h2 class="modal-h2">아이디 찾기</h2>
        <form id="findIdForm">
            <div class="form-group"><label>이름</label><input type="text" id="findIdName" required></div>
            <div class="form-group"><label>이메일</label><input type="email" id="findIdEmail" required></div>
            <button type="submit" class="btn btn-login">아이디 찾기</button>
        </form>
        <button class="btn-close-text" onclick="closeModal('findIdModal'); openModal('choiceModal')">돌아가기</button>
    </div>
</div>

<div id="findPwModal" class="modal">
    <div class="modal-content">
        <h2 class="modal-h2">비밀번호 찾기</h2>
        <form id="findPwForm">
            <div class="form-group"><label>아이디</label><input type="text" id="findPwId" required></div>
            <div class="form-group"><label>이름</label><input type="text" id="findPwName" required></div>
            <div class="form-group"><label>이메일</label><input type="email" id="findPwEmail" required></div>
            <button type="submit" class="btn btn-login" id="findPwBtn">임시 비밀번호 발급</button>
        </form>
        <button class="btn-close-text" onclick="closeModal('findPwModal'); openModal('choiceModal')">돌아가기</button>
    </div>
</div>

<footer>© 2026 쉬운 글 배움터</footer>

<script>
    const openModal = (id) => document.getElementById(id).style.display = 'flex';
    const closeModal = (id) => document.getElementById(id).style.display = 'none';

    // 아이디 찾기 성공 알림 (요청 문구 적용)
    document.getElementById('findIdForm').onsubmit = async function(e) {
        e.preventDefault();
        try {
            const res = await fetch('/api/find-id', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    name: document.getElementById('findIdName').value, 
                    email: document.getElementById('findIdEmail').value 
                })
            });
            const data = await res.json();
            if (res.ok) {
                alert(`요청하신 회원님의 아이디는 [ ${data.userId} ] 입니다.`);
                closeModal('findIdModal');
                openModal('loginModal');
            } else { alert(data.message || "정보가 일치하지 않습니다."); }
        } catch { alert("서버 오류"); }
    };

    // 비밀번호 찾기 (임시 비번 발급)
    document.getElementById('findPwForm').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('findPwBtn');
        btn.innerText = "발송 중..."; btn.disabled = true;
        try {
            const res = await fetch('/api/find-pw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: document.getElementById('findPwId').value,
                    name: document.getElementById('findPwName').value,
                    email: document.getElementById('findPwEmail').value
                })
            });
            if (res.ok) {
                alert("이메일로 임시 비밀번호를 발송했습니다.");
                closeModal('findPwModal');
                openModal('loginModal');
            } else { alert("정보가 일치하지 않습니다."); }
        } catch { alert("연결 실패"); }
        finally { btn.innerText = "임시 비밀번호 발급"; btn.disabled = false; }
    };

    // 로그인 및 UI 제어
    function updateUI(isLoggedIn, name = "") {
        document.getElementById('guest-menu').style.display = isLoggedIn ? 'none' : 'flex';
        document.getElementById('user-menu').style.display = isLoggedIn ? 'flex' : 'none';
        if(isLoggedIn) document.getElementById('u-info').innerHTML = `✨ <strong>${name}</strong>님`;
    }

    window.onload = async () => {
        try {
            const res = await fetch('/api/check-auth');
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('currentUser', data.name);
                updateUI(true, data.name);
            } else { updateUI(false); }
        } catch { updateUI(false); }
    };

    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: document.getElementById('loginId').value, pw: document.getElementById('loginPw').value })
        });
        if (res.ok) location.reload(); else alert("로그인 실패");
    };

    function handleLogout() {
        if (confirm("로그아웃 하시겠습니까?")) {
            fetch('/api/logout', { method: 'POST' }).then(() => {
                localStorage.removeItem('currentUser');
                location.href = "index.html";
            });
        }
    }

    function protectedRoute(url) {
        if (!localStorage.getItem('currentUser')) { alert("로그인 후 이용 가능합니다."); openModal('loginModal'); }
        else location.href = url;
    }

    window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; };
</script>
</body>
</html>
