<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8"/>
    <title>행동 사전</title>

    <style>
      :root {
        --primary-color: #4a90e2;
        --secondary-color: #ffd93d;
        --accent-color: #ff8a5c;
        --bg-color: #fdfbf7;
        --text-color: #333333;
        --white: #ffffff;
        --error-color: #e74c3c;
        --success-color: #2ecc71;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Nanum Gothic", sans-serif;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.8;
        word-break: keep-all;
      }

      header {
        background-color: var(--white);
        padding: 0 5%;
        height: 90px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 40px;
      }

      .logo {
        font-size: 28px;
        font-weight: 800;
        color: var(--primary-color);
        text-decoration: none;
      }

      .main-menu {
        display: flex;
        list-style: none;
        gap: 30px;
      }

      .main-menu li a {
        text-decoration: none;
        color: #444;
        font-size: 18px;
        font-weight: 700;
        transition: color 0.2s;
      }

      .main-menu li a:hover {
        color: var(--primary-color);
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      #guest-menu {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #user-menu {
        display: none;
        align-items: center;
        gap: 15px;
        font-weight: 700;
      }

      .login-btn {
        text-decoration: none;
        color: var(--text-color);
        font-weight: 700;
        padding: 10px 15px;
        cursor: pointer;
        background: none;
        border: none;
        font-size: 16px;
      }

      .signup-btn {
        background: var(--primary-color);
        color: white;
        padding: 10px 22px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
        transition: all 0.2s;
        border: none;
        cursor: pointer;
        font-size: 16px;
      }

      .signup-btn:hover {
        background-color: #357abd;
        transform: translateY(-2px);
      }

      .logout-btn {
        background: #eee;
        color: #666;
        padding: 8px 15px;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        font-weight: 700;
      }

      main {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .card {
        background: var(--white);
        border-radius: 30px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        margin-bottom: 30px;
      }

      h1 {
        font-size: 28px;
        color: var(--primary-color);
        margin-bottom: 10px;
        text-align: center;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
      }

      .search-container {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }

      input[type="text"] {
        flex: 1;
        padding: 15px 25px;
        border: 2px solid #e6eef8;
        border-radius: 50px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
      }

      input[type="text"]:focus {
        border-color: var(--primary-color);
      }

      .btn {
        padding: 15px 30px;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-primary {
        background: var(--primary-color);
        color: white;
      }

      .btn-primary:hover {
        background: #357abd;
      }

      .situation-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
        margin-bottom: 30px;
      }

      .situation-btn {
        padding: 15px;
        background: #f0f7ff;
        border: 2px solid #e1eefc;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 700;
        color: #444;
        transition: all 0.2s;
        text-align: center;
      }

      .situation-btn:hover {
        background: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
        transform: translateY(-2px);
      }

      #result {
        min-height: 100px;
        border: 2px dashed #bcd6f5;
        border-radius: 20px;
        padding: 25px;
        margin-top: 20px;
        background: #fff;
        line-height: 1.8;
      }

      /* 대화 예시 관련 스타일 */
      .dialogue-container {
        margin-top: 20px;
        background: #fafbfc;
        border-radius: 15px;
        padding: 20px;
      }
      .dialogue-title {
        font-weight: bold;
        margin-bottom: 10px;
        color: var(--primary-color);
      }
      .bubble {
        margin-bottom: 10px;
        padding: 10px 15px;
        border-radius: 15px;
        max-width: 80%;
        display: inline-block;
        clear: both;
      }
      .bubble.other {
        background: #e9ecef;
        float: left;
      }
      .bubble.me {
        background: #d2e3fc;
        float: right;
      }
      .clear { clear: both; }

      /* 퀴즈 영역 스타일 */
      .quiz-container {
        margin-top: 20px;
        background: #fff3cd;
        padding: 20px;
        border-radius: 15px;
      }
      .quiz-title {
        font-weight: bold;
        margin-bottom: 15px;
        color: #856404;
      }
      .option-btn {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 20px;
        margin-bottom: 8px;
        border: 1px solid #ffeeba;
        background: #fff;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        transition: background 0.2s;
      }
      .option-btn:hover {
        background: #fffdf5;
      }
      .option-btn.correct {
        background: #d4edda !important;
        border-color: #c3e6cb !important;
        color: #155724;
      }
      .option-btn.wrong {
        background: #f8d7da !important;
        border-color: #f5c6cb !important;
        color: #721c24;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <a href="./index.html" class="logo">✨ 쉬운 글 배움터</a>
        <ul class="main-menu">
          <li><a href="./about.html">서비스 소개</a></li>
          <li><a href="./text.html">쉬운 글 변환기</a></li>
          <li><a href="./behavior.html">행동 사전</a></li>
          <li><a href="./read.html">글 읽어주기</a></li>
        </ul>
      </div>
      <div class="header-right">
        <div id="guest-menu">
          <button class="login-btn" onclick="openLoginModal()">로그인</button>
          <button class="signup-btn" onclick="openSignupModal()">회원가입</button>
        </div>
        <div id="user-menu">
          <span id="user-info">사용자님, 환영합니다!</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        </div>
      </div>
    </header>

    <main>
      <div class="card">
        <h1>💬 사회성 행동 사전</h1>
        <p class="subtitle">어려운 상황에서 어떻게 말하고 행동해야 할지 알려줄게요.</p>

        <div class="search-container">
          <input type="text" id="search-input" placeholder="예: 친구가 화를 낼 때, 사과하는 법..."/>
          <button class="btn btn-primary" onclick="searchBehavior()">물어보기 🔍</button>
        </div>

        <p style="margin-bottom: 10px; font-weight: bold; color: #555;">많이 물어보는 상황들:</p>
        <div class="situation-list">
          <div class="situation-btn" onclick="clickSituation('친구에게 물건을 빌리고 싶을 때')">🤝 물건 빌릴 때</div>
          <div class="situation-btn" onclick="clickSituation('내가 실수해서 친구가 화났을 때')">😢 친구가 화났을 때</div>
          <div class="situation-btn" onclick="clickSituation('식당에서 음식을 주문할 때')">🍔 음식 주문할 때</div>
          <div class="situation-btn" onclick="clickSituation('모르는 길을 사람들에게 물어볼 때')">🗺️ 길 물어볼 때</div>
        </div>

        <div id="result">어떤 상황이 궁금한가요? 위에 적거나 버튼을 눌러보세요!</div>
      </div>
    </main>

    <script>
      // 💡 로그인 연동 로직
      window.onload = async function() {
        try {
          const response = await fetch('/api/check-auth');
          if (response.ok) {
            const userData = await response.json();
            localStorage.setItem('currentUser', userData.name);
            applyLoggedInUI(userData.name);
          } else {
            localStorage.removeItem('currentUser');
            applyLoggedOutUI();
          }
        } catch (error) {
          console.error("인증 상태 확인 중 오류:", error);
          applyLoggedOutUI();
        }
      };

      function applyLoggedInUI(userName) {
        const guestMenu = document.getElementById('guest-menu');
        const userMenu = document.getElementById('user-menu');
        const userInfo = document.getElementById('user-info');
        
        if (guestMenu) guestMenu.style.display = 'none';
        if (userMenu) userMenu.style.display = 'flex';
        if (userInfo) userInfo.innerHTML = `✨ <strong>${userName}</strong>님, 환영합니다!`;
      }

      function applyLoggedOutUI() {
        const guestMenu = document.getElementById('guest-menu');
        const userMenu = document.getElementById('user-menu');
        
        if (guestMenu) guestMenu.style.display = 'flex';
        if (userMenu) userMenu.style.display = 'none';
      }

      async function handleLogout() {
        if (confirm("로그아웃 하시겠습니까?")) {
          await fetch('/api/logout', { method: 'POST' });
          localStorage.removeItem('currentUser');
          location.reload();
        }
      }

      function openLoginModal() { location.href = "./index.html?login=true"; }
      function openSignupModal() { location.href = "./index.html?signup=true"; }

      // ────────────────────────────────────────────────────────
      // 🛠️ 기존 행동 사전 고유 스크립트 기능 (100% 원본 유지)
      // ────────────────────────────────────────────────────────
      function clickSituation(s) {
        document.getElementById("search-input").value = s;
        searchBehavior();
      }

      async function searchBehavior() {
        const query = document.getElementById("search-input").value.trim();
        if (!query) {
          alert("상황을 입력해주세요!");
          return;
        }
        const resDiv = document.getElementById("result");
        resDiv.innerHTML = "✨ 알맞은 행동과 대화 방법을 생각하고 있어요. 잠시만 기다려주세요...";

        try {
          const res = await fetch("/api/easy-behavior", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: query })
          });
          if (!res.ok) throw new Error("가져오기 실패");
          const data = await res.json();
          renderResult(data.result);
        } catch (e) {
          resDiv.innerHTML = "😢 일시적인 오류가 생겼어요. 다시 시도해주세요.";
        }
      }

      function safeParse(text) {
        try {
          return JSON.parse(text);
        } catch (e) {
          const match = text.match(/\{[\s\S]*\}/);
          return match ? JSON.parse(match[0]) : null;
        }
      }

      function renderResult(rawText) {
        const resDiv = document.getElementById("result");
        const obj = safeParse(rawText);
        if (!obj) {
          resDiv.innerHTML = rawText;
          return;
        }

        resDiv.innerHTML = ""; // 기존 내용 초기화

        if (obj.action) {
          const h3 = document.createElement("h3");
          h3.innerText = "💡 추천 행동 지침";
          const p = document.createElement("p");
          p.style.margin = "10px 0 20px 0";
          p.style.fontSize = "16px";
          p.innerText = obj.action;
          resDiv.appendChild(h3);
          resDiv.appendChild(p);
        }

        if (obj.dialogue && obj.dialogue.length > 0) {
          const dDiv = document.createElement("div");
          dDiv.className = "dialogue-container";
          const dTitle = document.createElement("div");
          dTitle.className = "dialogue-title";
          dTitle.innerText = "🗣️ 대화 연습해보기";
          dDiv.appendChild(dTitle);

          obj.dialogue.forEach(d => {
            const b = document.createElement("div");
            b.className = "bubble";
            if (d.role === "상대방" || d.role === "점원" || d.role === "친구") {
              b.classList.add("other");
              b.innerHTML = `<strong>${d.role}:</strong> ${d.text}`;
            } else {
              b.classList.add("me");
              b.innerHTML = `<strong>나:</strong> ${d.text}`;
            }
            const clear = document.createElement("div");
            clear.className = "clear";
            dDiv.appendChild(b);
            dDiv.appendChild(clear);
          });
          resDiv.appendChild(dDiv);
        }

        if (obj.quiz) {
          const q = obj.quiz;
          const qDiv = document.createElement("div");
          qDiv.className = "quiz-container";
          const qTitle = document.createElement("div");
          qTitle.className = "quiz-title";
          qTitle.innerText = `✏️ 오늘의 미니 퀴즈: ${q.question}`;
          qDiv.appendChild(qTitle);

          q.options.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = function() {
              document.querySelectorAll(".option-btn").forEach(b => b.disabled = true);
              if (i === q.answer) {
                btn.classList.add("correct");
                resDiv.innerHTML += `<div style='margin-top:15px; color:var(--success-color); font-weight:bold;'>✅ 정답이에요!<br><span style='font-weight:normal; color:#555;'>${q.explanation}</span></div>`;
              } else {
                btn.classList.add("wrong");
                resDiv.innerHTML += `<div style='margin-top:15px; color:var(--error-color); font-weight:bold;'>❌ 틀렸어요. 다시 생각해볼까요?<br><span style='font-weight:normal; color:#555;'>${q.explanation}</span></div>`;
              }
            };
            qDiv.appendChild(btn);
          });
          resDiv.appendChild(qDiv);
        }
      }
    </script>
  </body>
</html>
