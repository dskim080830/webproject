<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8"/>
    <title>행동 사전</title>

    <style>
      :root {
        --primary-color: #4a90e2;
        --secondary-color: #ffd93d;
        --accent-color: #ff8a5c;
        --bg-color: #fdfbf7;
        --text-color: #333333;
        --white: #ffffff;
        --error-color: #e74c3c;
        --success-color: #2ecc71;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: \"Nanum Gothic\", sans-serif;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.8;
        word-break: keep-all;
      }

      header {
        background-color: var(--white);
        padding: 0 5%;
        height: 90px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 40px;
      }
      .logo {
        font-size: 28px;
        font-weight: 800;
        color: var(--primary-color);
        text-decoration: none;
        white-space: nowrap;
      }
      .main-menu {
        display: flex;
        list-style: none;
        gap: 30px;
      }
      .main-menu li a {
        text-decoration: none;
        color: #444;
        font-size: 18px;
        font-weight: 700;
        transition: color 0.2s;
      }
      .main-menu li a:hover {
        color: var(--primary-color);
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      #guest-menu {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #user-menu {
        display: none;
        align-items: center;
        gap: 15px;
        font-weight: 700;
      }

      .login-btn,
      .signup-btn,
      .logout-btn {
        cursor: pointer;
        text-decoration: none;
        font-weight: 700;
        border: none;
        font-size: 16px;
      }
      .login-btn {
        background: none;
        color: var(--text-color);
        padding: 10px 15px;
      }
      .signup-btn {
        background-color: var(--primary-color);
        color: white;
        padding: 10px 22px;
        border-radius: 50px;
        box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
        transition: all 0.2s;
      }
      .logout-btn {
        background-color: #eee;
        color: #666;
        padding: 8px 15px;
        border-radius: 50px;
        font-size: 14px;
      }

      .wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        height: calc(100vh - 80px);
      }

      .card {
        width: 100%;
        max-width: 800px;
        height: 700px;
        background: var(--white);
        border-radius: 30px;
        padding: 30px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .quiz-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding-bottom: 120px;
      }

      #question {
        font-size: 22px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 25px;
      }

      #options {
        flex-grow: 1;
        overflow-y: auto;
        max-height: 300px;
      }

      .result-area {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        text-align: center;
      }

      #result {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 15px;
      }

      h2 {
        text-align: center;
        color: var(--primary-color);
        margin-bottom: 20px;
      }

      .option-btn {
        width: 100%;
        padding: 20px;
        margin: 10px 0;
        font-size: 20px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        background: #f0f7ff;
        transition: 0.2s;
      }

      .option-btn:hover {
        background: #dbe9ff;
      }

      .correct {
        background: var(--success-color) !important;
        color: white;
      }
      .wrong {
        background: var(--error-color) !important;
        color: white;
      }

      .next-btn-bottom {
        width: 100%;
        padding: 10px;
        font-size: 20px;
        font-weight: 800;
        border: none;
        border-radius: 20px;
        background: var(--primary-color);
        color: white;
        cursor: pointer;
        transition: 0.2s;
      }

      #loading {
        text-align: center;
        color: #888;
        margin-bottom: 10px;
      }

      /* 결과 화면 전용 추가 버튼 스타일 */
      .action-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 20px;
      }

      .btn-orange {
        background-color: var(--accent-color) !important;
        color: white;
      }
      .btn-green {
        background-color: var(--success-color) !important;
        color: white;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header-left">
        <a href="./index.html" class="logo">✨ 쉬운 글 배움터</a>
        <ul class="main-menu">
          <li><a href="./about.html">서비스 소개</a></li>
          <li><a href="./text.html">쉬운 글 변환기</a></li>
          <li><a href="./behavior.html">행동 사전</a></li>
          <li><a href="./read.html">글 읽어주기</a></li>
        </ul>
      </div>
      <div class="header-right">
        <div id="guest-menu">
          <a href="./index.html" class="login-btn">로그인</a>
          <a href="./index.html" class="signup-btn">회원가입</a>
        </div>
        <div id="user-menu">
          <span id="user-info">사용자님, 환영합니다!</span>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="wrapper">
      <div class="card">
        <h2>🤝 행동 사전</h2>
        <div id="loading">문제 생성 중...</div>
        
        <div id="quiz-ui-container" class="quiz-area">
          <p id="question"></p>
          <div id="options"></div>
        </div>

        <div class="result-area">
          <p id="result"></p>
          <div id="control-area" class="next-area">
            <button id="nextBtn" class="next-btn-bottom" onclick="nextQuiz()">
              다음 문제 ➡
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentUserLevel = "1";
      
      // 퀴즈 상태 관리 데이터 구조체 (새로운 코드 핵심 로직)
      let quizCache = [];
      let retryCache = [];
      let currentIdx = 0;
      let correctCount = 0;
      let isRetryMode = false;

      window.onload = async function() {
        try {
          const response = await fetch('/api/check-auth');
          if (response.ok) {
            const userData = await response.json();
            localStorage.setItem('currentUser', userData.name);
            if (userData.level) {
              currentUserLevel = userData.level.toString();
            }
            applyLoggedInUI(userData.name);
          }
        } catch (error) {
          console.error("인증 실패:", error);
        }

        // 초기 첫 문제 데이터 수신 및 로드
        try {
          const quiz = await fetchNewQuiz([]);
          quizCache[0] = quiz;
          document.getElementById("loading").textContent = "";
          renderQuiz(0);
        } catch (e) {
          document.getElementById("loading").textContent = "문제를 가져오지 못했습니다.";
        }
      };

      function getLevelPrompt(level) {
        switch(level) {
          case "4":
            return "난이도: 어려움.";
          case "3":
            return "난이도: 매우 쉬움. 주제: [인사하기, 손 씻기, 식사 예절, 쓰레기 버리기, 조용히 하기] 중 하나를 랜덤하게 선택. 아주 단순한 1단계 상황. 문장은 5단어 이내.";
          case "2":
            return "난이도: 쉬움. 초등 저학년 수준. 편의점에서 물건 사기, 친구에게 빌린 물건 돌려주기 등 일상 상황.";
          case "1":
          default:
            return "난이도: 보통. 경계선 지능 수준. 온라인 예절, 친구와의 오해 풀기 등 약간의 판단이 필요한 상황.";
        }
      }

      // 서버 API 결합형 맞춤형 신규 퀴즈 데이터 생성 함수
      async function fetchNewQuiz(excludeTitles = []) {
        const instruction = getLevelPrompt(currentUserLevel);
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            level: currentUserLevel,
            instruction: instruction,
            exclude: excludeTitles 
          }),
        });

        if (!res.ok) throw new Error("네트워크 오류");
        const data = await res.json();
        
        let quiz;
        if (typeof data.result === 'string') {
          quiz = safeParse(data.result);
        } else {
          quiz = data.result || data;
        }
        return quiz;
      }

      // 화면에 특정 인덱스의 퀴즈 요소를 렌더링
      function renderQuiz(idx) {
        const list = isRetryMode ? retryCache : quizCache;
        const q = list[idx];

        document.getElementById("question").textContent = `[Q${idx + 1}] ${q.question}`;
        document.getElementById("result").innerHTML = "";

        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";

        // 기존 제어 버튼 설정 초기화
        const nextBtn = document.getElementById("nextBtn");
        nextBtn.style.display = "none";
        nextBtn.className = "next-btn-bottom";
        nextBtn.textContent = "다음 문제 ➡";

        q.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = opt;

          if (q.chosen !== undefined) {
            btn.disabled = true;
            if (i === q.answer) btn.classList.add("correct");
            if (i === q.chosen && i !== q.answer) btn.classList.add("wrong");
          } else {
            btn.onclick = () => selectOption(i);
          }
          optionsDiv.appendChild(btn);
        });

        if (q.chosen !== undefined) {
          showExplanation(q.chosen === q.answer, q.explanation);
          nextBtn.style.display = "block";
        }
      }

      // 사용자가 보기를 골랐을 때 동작 로직
      function selectOption(chosenIdx) {
        const list = isRetryMode ? retryCache : quizCache;
        const q = list[currentIdx];
        q.chosen = chosenIdx;

        document.querySelectorAll(".option-btn").forEach((btn) => (btn.disabled = true));

        const isCorrect = chosenIdx === q.answer;
        if (isCorrect) {
          correctCount++;
        }

        const buttons = document.getElementById("options").children;
        buttons[chosenIdx].classList.add(isCorrect ? "correct" : "wrong");
        if (!isCorrect) {
          buttons[q.answer].classList.add("correct");
        }

        showExplanation(isCorrect, q.explanation);

        const nextBtn = document.getElementById("nextBtn");
        nextBtn.style.display = "block";
      }

      function showExplanation(isCorrect, text) {
        const resEl = document.getElementById("result");
        if (isCorrect) {
          resEl.innerHTML = `✅ <strong>정답이에요!</strong><br>${text}`;
        } else {
          resEl.innerHTML = `❌ <strong>틀렸어요.</strong><br>${text}`;
        }
      }

      // 다음 문제로 넘어가는 탐색 제어 흐름 처리 함수
      async function nextQuiz() {
        currentIdx++;
        const currentList = isRetryMode ? retryCache : quizCache;

        if (currentIdx < currentList.length) {
          renderQuiz(currentIdx);
          return;
        }

        if (!isRetryMode && quizCache.length < 5) {
          document.getElementById("loading").textContent = "✨ 다음 문제를 빌드하고 있어요...";
          try {
            const usedTitles = quizCache.map((q) => q.question);
            const newQ = await fetchNewQuiz(usedTitles);
            quizCache.push(newQ);
            document.getElementById("loading").textContent = "";
            renderQuiz(currentIdx);
          } catch (e) {
            document.getElementById("loading").textContent = "문제를 가져오지 못했습니다.";
            currentIdx--;
          }
        } else {
          showScoreReport();
        }
      }

      // 5개 세트 풀이 종료 후 맞춤형 결과 리포트 출력
      function showScoreReport() {
        document.getElementById("quiz-ui-container").style.display = "none";
        document.getElementById("result").innerHTML = "";

        const total = isRetryMode ? retryCache.length : quizCache.length;
        document.getElementById("question").innerHTML = `🎉 학습을 완료했습니다!<br>점수: ${correctCount} / ${total}`;

        const wrongItems = quizCache.filter((q) => q.chosen !== q.answer);
        const controlArea = document.getElementById("control-area");
        controlArea.innerHTML = "";

        const actionDiv = document.createElement("div");
        actionDiv.className = "action-buttons";

        // 1. 오답이 존재하는 경우 오답 다시 풀기 버튼 동적 생성
        if (!isRetryMode && wrongItems.length > 0) {
          const retryBtn = document.createElement("button");
          retryBtn.className = "next-btn-bottom btn-orange";
          retryBtn.textContent = `틀린 ${wrongItems.length}문제 다시 풀기 🔄`;
          retryBtn.onclick = startRetryMode;
          actionDiv.appendChild(retryBtn);
        }

        // 2. 새 세트 이어서 진행 버튼 생성
        const restartBtn = document.createElement("button");
        restartBtn.className = "next-btn-bottom btn-green";
        restartBtn.textContent = "새로운 문제 더 풀기 ➡";
        restartBtn.onclick = restartSet;
        actionDiv.appendChild(restartBtn);

        // 3. 홈으로 이동 버튼 생성
        const homeBtn = document.createElement("button");
        homeBtn.className = "next-btn-bottom";
        homeBtn.textContent = "메인 화면으로";
        homeBtn.onclick = goHome;
        actionDiv.appendChild(homeBtn);

        controlArea.appendChild(actionDiv);
      }

      // 오답 다시 풀기 전환 처리
      function startRetryMode() {
        retryCache = quizCache
          .filter((q) => q.chosen !== undefined && q.chosen !== q.answer)
          .map((q) => ({ ...q, chosen: undefined })); 

        if (retryCache.length === 0) return;

        isRetryMode = true;
        currentIdx = 0;
        correctCount = 0;
        restoreQuizUI();
        renderQuiz(0);
      }

      // 신규 세트 리프레시 및 초기화 처리
      function restartSet() {
        quizCache = [];
        retryCache = [];
        currentIdx = 0;
        correctCount = 0;
        isRetryMode = false;
        
        restoreQuizUI();
        document.getElementById("loading").textContent = "문제 생성 중...";
        document.getElementById("question").textContent = "";
        document.getElementById("options").innerHTML = "";
        
        fetchNewQuiz([])
          .then((quiz) => {
            quizCache[0] = quiz;
            document.getElementById("loading").textContent = "";
            renderQuiz(0);
          })
          .catch(() => {
            document.getElementById("loading").textContent = "오류가 발생했어요.";
          });
      }

      function restoreQuizUI() {
        document.getElementById("quiz-ui-container").style.display = "flex";
        const controlArea = document.getElementById("control-area");
        controlArea.innerHTML = `<button id="nextBtn" class="next-btn-bottom" onclick="nextQuiz()">다음 문제 ➡</button>`;
      }

      function goHome() {
        location.href = "./index.html";
      }

      function applyLoggedInUI(userName) {
        const guestMenu = document.getElementById('guest-menu');
        const userMenu = document.getElementById('user-menu');
        const userInfo = document.getElementById('user-info');
        
        if (guestMenu) guestMenu.style.display = 'none';
        if (userMenu) userMenu.style.display = 'flex';
        if (userInfo) userInfo.innerHTML = `✨ <strong>${userName}</strong>님, 환영합니다!`;
      }

      async function handleLogout() {
        if (confirm("로그아웃 하시겠습니까?")) {
          await fetch('/api/logout', { method: 'POST' });
          localStorage.removeItem('currentUser');
          location.href = "index.html";
        }
      }

      function safeParse(text) {
        try {
          return JSON.parse(text);
        } catch (e) {
          const match = text.match(/\{[\s\S]*\}/);
          return match ? JSON.parse(match[0]) : null;
        }
      }
    </script>
  </body>
</html>
