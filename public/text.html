<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쉬운 글 변환기 - 쉬운 글 배움터</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #fdfbf7;
            --white: #ffffff;
            --text: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Nanum Gothic", sans-serif; }
        body { background-color: var(--bg); color: var(--text); }

        /* 헤더 스타일 */
        header {
            background-color: var(--white);
            padding: 0 5%;
            height: 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 40px; }
        .logo { font-size: 28px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .main-menu { display: flex; list-style: none; gap: 30px; }
        .main-menu li a { text-decoration: none; color: #444; font-size: 18px; font-weight: 700; transition: color 0.2s; }
        .main-menu li a:hover { color: var(--primary); }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        #guest-menu { display: flex; align-items: center; gap: 10px; }
        #user-menu { display: none; align-items: center; gap: 15px; font-weight: 700; }
        
        .login-btn { text-decoration: none; color: var(--text); font-weight: 700; padding: 10px 15px; }
        .signup-btn { 
            background: var(--primary); color: white; padding: 10px 22px; border-radius: 50px; 
            text-decoration: none; font-weight: 700; box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
            transition: all 0.2s;
        }
        .signup-btn:hover { background-color: #357abd; transform: translateY(-2px); }
        
        .logout-btn { background: #eee; color: #666; padding: 8px 15px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; }

        /* 컨텐츠 스타일 */
        .container { max-width: 900px; margin: 60px auto; padding: 0 20px; }
        .card { background: var(--white); padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .title-area { text-align: center; margin-bottom: 30px; }
        .title-area h2 { color: var(--primary); font-size: 32px; margin-bottom: 10px; font-weight: 800; }
        
        textarea { 
            width: 100%; height: 220px; padding: 25px; border-radius: 20px; 
            border: 2px solid #e6eef8; font-size: 18px; resize: none; margin-bottom: 25px;
            outline: none; transition: border-color 0.3s;
        }
        textarea:focus { border-color: var(--primary); }
        
        .info-bar { 
            background: #f0f7ff; padding: 18px 30px; border-radius: 50px; 
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
            font-size: 17px;
        }
        .user-level-badge { color: var(--primary); font-weight: 800; background: white; padding: 5px 15px; border-radius: 20px; }

        .convert-btn { 
            width: 100%; padding: 20px; background: var(--primary); color: white; border: none; 
            border-radius: 50px; font-size: 20px; font-weight: 800; cursor: pointer;
            box-shadow: 0 6px 15px rgba(74, 144, 226, 0.3); transition: all 0.3s;
        }
        .convert-btn:hover { background-color: #357abd; transform: translateY(-3px); }

        .result-box { 
            margin-top: 35px; padding: 30px; border-radius: 25px; 
            background: #fff; border: 2px dashed #bcd6f5; min-height: 120px; line-height: 1.8;
            font-size: 18px;
        }
        
        /* 단축어 툴팁 스타일 */
        .word { 
            border-bottom: 2px solid var(--primary); 
            cursor: help; 
            font-weight: bold; 
            color: var(--primary);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="./index.html" class="logo">✨ 쉬운 글 배움터</a>
            <ul class="main-menu">
                <li><a href="./about.html">서비스 소개</a></li>
                <li><a href="./text.html">쉬운 글 변환기</a></li>
                <li><a href="./behavior.html">행동 사전</a></li>
                <li><a href="./read.html">글 읽어주기</a></li>
            </ul>
        </div>
        <div class="header-right">
            <div id="guest-menu">
                <a href="javascript:void(0)" onclick="openLoginModal()" class="login-btn">로그인</a>
                <a href="javascript:void(0)" onclick="openSignupModal()" class="signup-btn">회원가입</a>
            </div>
            <div id="user-menu">
                <span id="user-info"></span>
                <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="title-area">
                <h2>✍️ 쉬운 글 변환기</h2>
                <p>내가 읽기 힘든 복잡한 글을 입력하면 내 수준에 딱 맞춰서 바꿔줘요!</p>
            </div>

            <textarea id="inputText" placeholder="여기에 어렵거나 복잡한 글을 복사해서 붙여넣어 보세요..."></textarea>

            <div class="info-bar">
                <span>나의 맞춤 학습 수준: <span id="displayLevel" class="user-level-badge">불러오는 중...</span></span>
                <input type="hidden" id="userLevelValue" value="normal">
            </div>

            <button class="convert-btn" onclick="convertText()">지금 바로 변환하기 🚀</button>

            <div id="result" class="result-box">변환 결과가 여기에 표시됩니다.</div>
        </div>
    </div>

    <script type="module">
        import { easyWordMap, replaceMap } from './api/wordMap.js';

        // UI를 즉시 업데이트하는 함수
        function updateLoginUI(userName) {
            const guestMenu = document.getElementById('guest-menu');
            const userMenu = document.getElementById('user-menu');
            const userInfo = document.getElementById('user-info');
            
            if (userName) {
                guestMenu.style.display = 'none';
                userMenu.style.display = 'flex';
                userInfo.innerHTML = `✨ <strong>${userName}</strong>님, 환영합니다!`;
            } else {
                guestMenu.style.display = 'flex';
                userMenu.style.display = 'none';
            }
        }

        window.onload = async function() {
            // 1. 서버 확인 전, 로컬 스토리지 데이터로 선제적 UI 적용 (끊김 방지)
            const cachedName = localStorage.getItem('currentUser');
            if (cachedName) updateLoginUI(cachedName);

            try {
                // 2. 서버 세션 실시간 확인 (check-auth.js 경로 확인 필수)
                const response = await fetch('./api/check-auth.js');
                if (response.ok) {
                    const userData = await response.json();
                    const finalName = userData.name || userData.userId || "사용자";
                    
                    localStorage.setItem('currentUser', finalName); // 최신 데이터 동기화
                    updateLoginUI(finalName);

                    // 학습 수준 적용 (수준 1, 2, 3 로직 복원)
                    if (userData.level !== undefined) {
                        const lv = String(userData.level);
                        let text = "보통";
                        let internal = "normal";

                        if(lv === "1") { text = "경계선 지능"; internal = "normal"; }
                        else if(lv === "2") { text = "경도 지적 장애"; internal = "easy"; }
                        else if(lv === "3") { text = "중증 지적 장애"; internalLevel = "veryEasy"; }

                        document.getElementById('displayLevel').innerText = text;
                        document.getElementById('userLevelValue').value = internal;
                    }
                } else {
                    // 세션이 없으면 정보 삭제
                    localStorage.removeItem('currentUser');
                    updateLoginUI(null);
                }
            } catch (e) {
                console.error("인증 확인 실패", e);
            }
        };

        // 로그아웃
        window.handleLogout = async function() {
            if (confirm("로그아웃 하시겠습니까?")) {
                await fetch('./api/logout.js', { method: 'POST' });
                localStorage.removeItem('currentUser');
                location.href = "index.html";
            }
        };

        // 변환 및 툴팁 생성
        window.convertText = function() {
            const text = document.getElementById("inputText").value.trim();
            const lvKey = document.getElementById("userLevelValue").value;
            const resBox = document.getElementById("result");

            if (!text) return alert("내용을 입력하세요!");

            let html = text;

            // replaceMap 적용
            Object.keys(replaceMap).forEach(k => {
                html = html.replace(new RegExp(k, 'g'), replaceMap[k]);
            });

            // easyWordMap 적용 (title 속성으로 마우스 오버 툴팁 생성)
            Object.keys(easyWordMap).forEach(w => {
                const regex = new RegExp(w, 'g');
                if (regex.test(html)) {
                    const easy = easyWordMap[w][lvKey];
                    html = html.replace(regex, `<span class="word" title="원래 뜻: ${w}">${easy}</span>`);
                }
            });

            resBox.innerHTML = html.replace(/\n/g, '<br>');
        };

        window.openLoginModal = () => { location.href = "./index.html?login=true"; };
        window.openSignupModal = () => { location.href = "./index.html?signup=true"; };
    </script>
</body>
</html>
