<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쉬운 글 변환기 - 쉬운 글 배움터</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        :root { 
            --primary: #4a90e2; 
            --modal-blue: #5191e3; 
            --bg: #fdfbf7; 
            --white: #ffffff; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Nanum Gothic", sans-serif; }
        body { background-color: var(--bg); color: #333; line-height: 1.8; }

        /* 헤더 스타일 */
        header { 
            background-color: var(--white); 
            padding: 0 5%; 
            height: 90px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .logo { font-size: 28px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .header-left { display: flex; align-items: center; gap: 40px; }
        .main-menu { display: flex; list-style: none; gap: 30px; }
        .main-menu li a { text-decoration: none; color: #444; font-size: 18px; font-weight: 700; transition: 0.2s; }
        .main-menu li a:hover { color: var(--primary); }

        .header-right { display: flex; align-items: center; gap: 15px; }
        .logout-btn { background-color: #eee; color: #666; padding: 8px 18px; border-radius: 50px; border: none; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .logout-btn:hover { background-color: #e0e0e0; }

        /* 컨테이너 및 변환기 UI */
        .container { max-width: 1100px; margin: 50px auto; padding: 0 20px; }
        .converter-box { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        
        @media (max-width: 850px) {
            .converter-box { grid-template-columns: 1fr; }
        }

        .input-panel, .output-panel { background: white; padding: 35px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        h2 { font-size: 22px; font-weight: 800; margin-bottom: 15px; color: #333; }
        textarea { 
            width: 100%; 
            height: 350px; 
            border: 1.5px solid #eee; 
            border-radius: 20px; 
            padding: 20px; 
            font-size: 17px; 
            resize: none; 
            outline: none; 
            background: #fafafa; 
            margin-top: 10px; 
            transition: 0.3s;
        }
        textarea:focus { border-color: var(--primary); background: #fff; }
        
        /* 지능 수준 표시 바 */
        .level-indicator { 
            margin-bottom: 25px; 
            padding: 18px; 
            background: #f0f7ff; 
            border-radius: 20px; 
            border-left: 6px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }
        .level-tag { font-weight: 800; color: var(--primary); font-size: 19px; }

        .btn-convert { 
            width: 100%; 
            padding: 20px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 20px; 
            font-size: 19px; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 20px; 
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }
        .btn-convert:hover { background: #357abd; transform: translateY(-2px); }

        .result-area { 
            min-height: 350px; 
            padding: 25px; 
            border-radius: 20px; 
            background: #f8fbff; 
            font-size: 18px; 
            line-height: 1.9; 
            color: #444;
            word-break: keep-all;
        }
        
        /* 변환된 단어 강조 스타일 */
        .highlight-word { 
            color: var(--primary); 
            font-weight: 800; 
            border-bottom: 2.5px solid #cfe2ff; 
            padding: 0 2px;
            cursor: help;
        }

        footer { text-align: center; padding: 60px 0; color: #888; font-size: 15px; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="index.html" class="logo">✨ 쉬운 글 배움터</a>
        <ul class="main-menu">
            <li><a href="./about.html">서비스 소개</a></li>
            <li><a href="./text.html" style="color: var(--primary);">쉬운 글 변환기</a></li>
            <li><a href="./behavior.html">행동 사전</a></li>
            <li><a href="./read.html">글 읽어주기</a></li>
        </ul>
    </div>
    <div class="header-right">
        <span id="user-info" style="font-weight: 700;"></span>
        <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
    </div>
</header>

<div class="container">
    <div class="converter-box">
        <div class="input-panel">
            <div class="level-indicator">
                <span>내 맞춤 수준:</span>
                <span id="displayLevel" class="level-tag">정보 불러오는 중...</span>
            </div>
            <h2>바꿀 내용을 적어주세요</h2>
            <textarea id="inputText" placeholder="여기에 어려운 문장이나 단어가 포함된 글을 입력해 주세요. 예: 금일 합의를 통해 생산을 재개하기로 했습니다."></textarea>
            <button class="btn-convert" onclick="processConversion()">내 수준에 맞춰 바꾸기</button>
        </div>

        <div class="output-panel">
            <h2>변환 결과</h2>
            <div id="resultArea" class="result-area">
                왼쪽 판넬에 내용을 입력하고 버튼을 누르면, 이곳에 쉬운 글이 나타납니다.
            </div>
        </div>
    </div>
</div>

<footer>© 2026 쉬운 글 배움터</footer>

<script type="module">
    // api 폴더에 위치한 wordMap.js에서 데이터 임포트
    import { easyWordMap, replaceMap } from './api/wordMap.js';

    let userMapLevel = 'normal'; // 기본값 (레벨 1)

    // 페이지 로드 시 실행: 로그인 확인 및 사용자의 지능 레벨 설정
    window.onload = async () => {
        try {
            const res = await fetch('/api/check-auth');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('user-info').innerHTML = `✨ <strong>${data.name}</strong>님`;
                
                const levelDisplay = document.getElementById('displayLevel');
                
                // 가입 정보의 data.level (1, 2, 3)에 따라 wordMap의 키값 매핑
                if (data.level == 1) {
                    userMapLevel = 'normal'; // 경계선 지능
                    levelDisplay.innerText = "레벨 1 (경계선 지능)";
                } else if (data.level == 2) {
                    userMapLevel = 'easy';   // 경도 지적 장애
                    levelDisplay.innerText = "레벨 2 (경도 지적 장애)";
                } else if (data.level == 3) {
                    userMapLevel = 'veryEasy'; // 중증 지적 장애
                    levelDisplay.innerText = "레벨 3 (중증 지적 장애)";
                } else {
                    userMapLevel = 'normal';
                    levelDisplay.innerText = "기본 수준";
                }
            } else {
                // 로그인 세션이 없으면 메인으로 리다이렉트
                alert("로그인이 필요한 서비스입니다.");
                location.href = "index.html";
            }
        } catch (err) {
            console.error("인증 확인 오류:", err);
            document.getElementById('displayLevel').innerText = "오류 발생";
        }
    };

    // 변환 버튼 클릭 시 실행되는 메인 로직
    window.processConversion = () => {
        const inputTextArea = document.getElementById('inputText');
        const resultArea = document.getElementById('resultArea');
        let text = inputTextArea.value;

        if (!text.trim()) {
            alert("변환할 내용을 입력해 주세요.");
            inputTextArea.focus();
            return;
        }

        let resultHTML = text;

        // 1단계: 단순 단어 교체 (replaceMap 사용 - 금일 -> 오늘 등)
        Object.keys(replaceMap).forEach(key => {
            const regex = new RegExp(key, 'g');
            resultHTML = resultHTML.replace(regex, replaceMap[key]);
        });

        // 2단계: 지능 수준별 상세 변환 (easyWordMap 사용)
        // 사용자의 레벨(normal, easy, veryEasy)에 해당하는 설명을 매칭
        Object.keys(easyWordMap).forEach(key => {
            const regex = new RegExp(key, 'g');
            const easyValue = easyWordMap[key][userMapLevel];
            
            // 변환된 단어를 시각적으로 강조하기 위해 span 태그로 감쌈
            resultHTML = resultHTML.replace(regex, `<span class="highlight-word" title="원래 단어: ${key}">${easyValue}</span>`);
        });

        // 결과 출력 (줄바꿈 보존을 위해 \n을 <br>로 변경)
        resultArea.innerHTML = resultHTML.replace(/\n/g, '<br>');
    };

    // 로그아웃 처리
    window.handleLogout = async () => {
        if (confirm("로그아웃 하시겠습니까?")) {
            try {
                await fetch('/api/logout', { method: 'POST' });
                localStorage.removeItem('currentUser');
                location.href = "index.html";
            } catch (err) {
                console.error("로그아웃 실패:", err);
                location.href = "index.html";
            }
        }
    };
</script>
</body>
</html>
